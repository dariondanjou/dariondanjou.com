<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0c" />
<title>NOTED — Shotlist</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0b0c'/%3E%3Ctext x='50%25' y='58%25' text-anchor='middle' font-family='system-ui,sans-serif' font-size='14' font-weight='700' fill='%23f4f4f5'%3EN%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">NOTED</span>
      <span class="brand-sub">shotlist</span>
    </div>
    <div class="progress" aria-live="polite">
      <span id="progress-count">0 / 0</span>
      <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
    </div>
    <div class="actions">
      <button id="filter-toggle" class="btn" type="button" aria-pressed="false">Hide done</button>
      <button id="reset" class="btn btn-ghost" type="button">Reset</button>
    </div>
  </div>
</header>

<main id="grid" class="grid" aria-label="Storyboard shots"></main>

<template id="card-template">
  <article class="card" data-shot="">
    <label class="card-inner">
      <div class="thumb-wrap">
        <img class="thumb" alt="" loading="lazy" decoding="async" />
        <span class="check-overlay" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="44" height="44"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
      <div class="row">
        <input type="checkbox" class="check" />
        <span class="shot-label"></span>
      </div>
    </label>
  </article>
</template>

<footer class="footnote">localStorage: <code id="ls-key">noted.shotlist.v1</code></footer>

<script src="./app.js"></script>
</body>
</html>
